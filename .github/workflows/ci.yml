name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Headless smoke test
        run: xvfb-run -a npm run smoke -- --no-sandbox

  package:
    name: Package check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unpacked application
        run: npx electron-builder ${{ matrix.args }} --dir --publish never
