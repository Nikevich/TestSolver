appId: local.testsolver
productName: TestSolver
copyright: Copyright © 2026 Shkilevich Nikita
asar: true
compression: normal
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - assets/icon.ico
  - assets/icon.png
  - package.json
  - LICENSE
  - COMMERCIAL.md
  - THIRD-PARTY-NOTICES.md
  - TRADEMARKS.md
  - "!**/*.map"
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: COMMERCIAL.md
    to: COMMERCIAL.md
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: TRADEMARKS.md
    to: TRADEMARKS.md
win:
  icon: assets/icon.ico
  target:
    - nsis
    - portable
  artifactName: "${productName}-${version}-${arch}.${ext}"
linux:
  icon: assets/icon.png
  category: Education
  maintainer: Shkilevich Nikita <nik.shkilevich3@gmail.com>
  target:
    - AppImage
    - deb
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TestSolver
  license: assets/installer-license.txt
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
